<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f3ef" />
  <meta name="color-scheme" content="light" />

  <title>Wattzn — The future of strength intelligence.</title>
  <meta name="description" content="Wattzn is building a new standard for understanding human performance. Join the early-access list." />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Wattzn" />
  <meta property="og:title" content="Wattzn — The future of strength intelligence." />
  <meta property="og:description" content="Wattzn is building a new standard for understanding human performance. Join the early-access list." />
  <meta property="og:url" content="https://wattzn.com/" />
  <meta property="og:image" content="https://wattzn.com/og.png" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Wattzn — The future of strength intelligence." />
  <meta name="twitter:description" content="Wattzn is building a new standard for understanding human performance. Join the early-access list." />

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='2' fill='%23f4f3ef'/%3E%3Ctext x='16' y='22' font-family='-apple-system,Segoe UI,sans-serif' font-size='15' font-weight='800' letter-spacing='0.5' text-anchor='middle' fill='%230d0d0d'%3EW%3C/text%3E%3C/svg%3E" />

  <style>
    :root {
      --bg: #f4f3ef;
      --fg: #0d0d0d;
      --fg-muted: #6b6862;
      --fg-dim: #8a877f;
      --line: rgba(13, 13, 13, 0.14);
      --line-strong: #0d0d0d;
      --accent: #d62b1c;
      --maxw: 1280px;
      --pad-x: clamp(22px, 4.6vw, 64px);
      --gutter: clamp(28px, 5.5vw, 96px);
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, "Helvetica Neue", sans-serif;
      --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body { margin: 0; padding: 0; }
    html { background: var(--bg); }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--fg);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      line-height: 1.5;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    ::selection { background: var(--fg); color: var(--bg); }

    a { color: inherit; text-decoration: none; }

    a:focus-visible,
    button:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--fg);
      outline-offset: 3px;
    }

    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }

    .shell {
      width: 100%;
      max-width: var(--maxw);
      margin: 0 auto;
      padding: 0 var(--pad-x);
      flex: 1 0 auto;
      display: flex;
      flex-direction: column;
    }

    .rule {
      border: 0;
      height: 1px;
      width: 100%;
      background: var(--line);
      margin: 0;
    }

    /* Masthead */
    .masthead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: clamp(22px, 3.2vw, 32px) 0;
    }

    .wordmark {
      font-family: var(--font);
      font-weight: 800;
      font-size: clamp(14px, 1.3vw, 16px);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--fg);
      line-height: 1;
    }

    .meta {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--fg-muted);
      white-space: nowrap;
    }

    /* Main */
    main {
      flex: 1 0 auto;
      display: flex;
      flex-direction: column;
    }

    /* Hero */
    .hero {
      display: grid;
      grid-template-columns: 1fr;
      gap: clamp(28px, 5vw, 56px);
      padding: clamp(72px, 13vw, 176px) 0 clamp(64px, 10vw, 128px);
      align-items: end;
    }

    @media (min-width: 860px) {
      .hero {
        grid-template-columns: minmax(0, 7fr) minmax(0, 5fr);
        column-gap: var(--gutter);
      }
    }

    .hero h1 {
      font-family: var(--font);
      font-size: clamp(48px, 9.6vw, 136px);
      font-weight: 700;
      line-height: 0.94;
      letter-spacing: -0.046em;
      margin: 0;
      color: var(--fg);
      text-wrap: balance;
    }

    .hero h1 .dot {
      color: var(--accent);
    }

    .hero-body {
      display: flex;
      flex-direction: column;
      gap: clamp(14px, 1.6vw, 20px);
      max-width: 42ch;
    }

    @media (min-width: 860px) {
      .hero-body {
        padding-bottom: clamp(8px, 1vw, 14px);
      }
    }

    .hero-body p {
      margin: 0;
      font-size: clamp(16px, 1.4vw, 19px);
      line-height: 1.55;
      color: var(--fg-muted);
    }

    /* CTA */
    .cta {
      display: grid;
      grid-template-columns: 1fr;
      gap: clamp(28px, 4vw, 56px);
      padding: clamp(64px, 9vw, 112px) 0 clamp(72px, 10vw, 128px);
      align-items: start;
    }

    @media (min-width: 860px) {
      .cta {
        grid-template-columns: minmax(0, 6fr) minmax(0, 6fr);
        column-gap: var(--gutter);
      }
    }

    .cta h2 {
      font-family: var(--font);
      font-size: clamp(30px, 4.4vw, 56px);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.02;
      margin: 0;
      color: var(--fg);
      text-wrap: balance;
      max-width: 14ch;
    }

    .cta-body {
      display: flex;
      flex-direction: column;
      gap: clamp(22px, 2.6vw, 30px);
      max-width: 520px;
    }

    .cta-body > p {
      margin: 0;
      font-size: clamp(16px, 1.4vw, 19px);
      line-height: 1.55;
      color: var(--fg-muted);
    }

    /* Form */
    form {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      width: 100%;
    }

    @media (min-width: 560px) {
      form {
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: end;
        column-gap: 18px;
      }
    }

    .field {
      position: relative;
      min-width: 0;
    }

    input[type="email"] {
      width: 100%;
      font: inherit;
      font-size: 16px;
      color: var(--fg);
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--line-strong);
      padding: 12px 0 13px;
      transition: border-color 160ms ease, padding-bottom 160ms ease;
      -webkit-appearance: none;
      appearance: none;
      border-radius: 0;
    }

    input[type="email"]::placeholder {
      color: var(--fg-dim);
    }

    input[type="email"]:hover {
      border-bottom-color: var(--fg);
    }

    input[type="email"]:focus {
      outline: none;
      border-bottom-width: 2px;
      padding-bottom: 12px;
    }

    input[type="email"][aria-invalid="true"] {
      border-bottom-color: var(--accent);
    }

    button[type="submit"] {
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--bg);
      background: var(--fg);
      border: 1px solid var(--fg);
      padding: 16px 22px;
      cursor: pointer;
      transition: background-color 160ms ease, color 160ms ease, opacity 160ms ease;
      border-radius: 0;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      white-space: nowrap;
      line-height: 1;
    }

    button[type="submit"]:hover { background: #1f1f1f; }
    button[type="submit"]:active { transform: translateY(1px); }
    button[type="submit"][disabled] { opacity: 0.55; cursor: progress; }

    button .arrow {
      display: inline-block;
      transition: transform 160ms ease;
      font-weight: 400;
      font-size: 14px;
      transform: translateY(-0.5px);
    }
    button[type="submit"]:hover .arrow { transform: translateX(3px) translateY(-0.5px); }

    .msg {
      grid-column: 1 / -1;
      margin: 4px 0 0;
      min-height: 20px;
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.04em;
      line-height: 1.4;
      color: var(--fg-muted);
    }

    .msg[data-state="success"] { color: var(--fg); }
    .msg[data-state="error"] { color: var(--accent); }

    /* Footer */
    footer {
      padding: clamp(22px, 3vw, 32px) 0 clamp(28px, 3.5vw, 40px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.04em;
      color: var(--fg-muted);
    }

    footer nav {
      display: flex;
      gap: 28px;
    }

    footer a {
      color: var(--fg-muted);
      transition: color 160ms ease;
    }

    footer a:hover { color: var(--fg); }

    /* Reveal */
    .reveal {
      opacity: 0;
      transform: translateY(6px);
      animation: rise 720ms cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
    }
    .reveal.d1 { animation-delay: 60ms; }
    .reveal.d2 { animation-delay: 160ms; }
    .reveal.d3 { animation-delay: 260ms; }
    .reveal.d4 { animation-delay: 360ms; }
    .reveal.d5 { animation-delay: 460ms; }

    @keyframes rise {
      to { opacity: 1; transform: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .reveal { opacity: 1 !important; transform: none !important; animation: none !important; }
      button[type="submit"]:hover .arrow { transform: translateY(-0.5px); }
    }

    @media (max-width: 560px) {
      .meta { display: none; }
      button[type="submit"] { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="masthead">
      <a class="wordmark reveal" href="/" aria-label="Wattzn home">WATTZN</a>
    </header>

    <hr class="rule reveal d1" />

    <main>
      <section class="hero" aria-labelledby="hero-title">
        <h1 id="hero-title" class="reveal d1">The future of strength intelligence<span class="dot">.</span></h1>
        <div class="hero-body">
          <p class="reveal d2">Wattzn is building a new standard for understanding human performance.</p>
          <p class="reveal d3">Training is evolving. The way we understand it should too.</p>
        </div>
      </section>

      <hr class="rule" />

      <section class="cta" aria-labelledby="cta-title">
        <h2 id="cta-title" class="reveal d4">Join the early-access list.</h2>
        <div class="cta-body">
          <p class="reveal d4">Be among the first to hear what comes next.</p>
          <form id="signup" class="reveal d5" novalidate
                action="https://formspree.io/f/mrewzqae"
                method="POST">
            <div class="field">
              <label for="email" class="sr-only">Email address</label>
              <input
                id="email"
                name="email"
                type="email"
                autocomplete="email"
                inputmode="email"
                placeholder="Email address"
                required
                aria-describedby="form-msg"
              />
            </div>
            <button type="submit" id="submit-btn">
              <span>Join the early-access list</span>
              <span class="arrow" aria-hidden="true">&rarr;</span>
            </button>
            <p id="form-msg" class="msg" role="status" aria-live="polite"></p>
          </form>
        </div>
      </section>
    </main>

    <hr class="rule" />

    <footer>
      <span>&copy; 2026 Wattzn LLC</span>
    </footer>
  </div>

  <script>
    (function () {
      var form = document.getElementById("signup");
      var input = document.getElementById("email");
      var btn = document.getElementById("submit-btn");
      var msg = document.getElementById("form-msg");

      var EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

      function setMessage(text, state) {
        msg.textContent = text || "";
        if (state) {
          msg.setAttribute("data-state", state);
        } else {
          msg.removeAttribute("data-state");
        }
      }

      input.addEventListener("input", function () {
        if (input.getAttribute("aria-invalid") === "true") {
          input.removeAttribute("aria-invalid");
          setMessage("", null);
        }
      });

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        var value = (input.value || "").trim();

        if (!value || !EMAIL_RE.test(value)) {
          input.setAttribute("aria-invalid", "true");
          setMessage("Please enter a valid email address.", "error");
          input.focus();
          return;
        }

        var action = form.getAttribute("action") || "";
        if (action.indexOf("REPLACE_ME") !== -1) {
          setMessage("Thanks — you're on the list.", "success");
          form.reset();
          return;
        }

        btn.disabled = true;
        var originalLabel = btn.querySelector("span").textContent;
        btn.querySelector("span").textContent = "Sending…";
        setMessage("", null);

        var data = new FormData(form);

        fetch(action, {
          method: "POST",
          body: data,
          headers: { "Accept": "application/json" }
        }).then(function (res) {
          if (res.ok) {
            setMessage("Thanks — you're on the list.", "success");
            form.reset();
          } else {
            return res.json().then(function (body) {
              var detail = body && body.errors && body.errors[0] && body.errors[0].message;
              setMessage(detail || "Something went wrong. Please try again.", "error");
            }).catch(function () {
              setMessage("Something went wrong. Please try again.", "error");
            });
          }
        }).catch(function () {
          setMessage("Network error. Please try again.", "error");
        }).then(function () {
          btn.disabled = false;
          btn.querySelector("span").textContent = originalLabel;
        });
      });
    })();
  </script>
</body>
</html>
